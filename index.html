/* Tema: usa el guardado, o el del sistema. Se aplica antes de pintar para evitar parpadeos. */
(function(){
  var t=null;
  try{t=localStorage.getItem("kixki-theme");}catch(e){}
  if(t!=="dark"&&t!=="light"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
  document.documentElement.setAttribute("data-theme",t);

})();
