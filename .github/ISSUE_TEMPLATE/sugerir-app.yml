name: Sugerir una app
description: Propón una app para Kixki Store
title: "Sugerencia: "
labels: ["sugerencia"]
body:
  - type: markdown
    attributes:
      value: "⚠️ Esto es público. No pongas datos personales."
  - type: input
    id: enlace
    attributes:
      label: Enlace de la app
      description: GitHub, F-Droid o Google Play
      placeholder: https://
    validations: { required: true }
  - type: textarea
    id: para-que
    attributes:
      label: ¿Para qué sirve y por qué la recomiendas?
    validations: { required: true }
